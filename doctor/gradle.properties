# Project-wide Gradle settings.
# Optimize resource consumption: throttle max workers to 2 to prevent CPU 100% saturation and save battery
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.vfs.watch=true
kotlin.incremental=true

# Configuration Cache allows Gradle to skip configuration phase when scripts haven't changed
org.gradle.configuration-cache=true

# Kotlin code style
kotlin.code.style=official